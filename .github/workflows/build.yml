# Builds the app for one platform, by hand (Actions > Build > Run workflow),
# from the game.wasm in a draft release of this repository, and puts the
# result into that draft: nothing built from the game is published. Meant
# for forks: see docs/github-build.md.
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [ios, android, windows, macos, linux-x86_64, linux-aarch64]
        default: ios

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform }}

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ fromJSON('{"ios":"macos-15","macos":"macos-15","android":"ubuntu-24.04","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","windows":"windows-2022"}')[inputs.platform] }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Up to date
        continue-on-error: true
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent | select(.) | .full_name + " " + .default_branch')
          [ -n "$parent" ] || exit 0
          read -r name branch <<<"$parent"
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...${name%%/*}:$branch" --jq .ahead_by)
          if [ "${behind:-0}" -gt 0 ]; then
              echo "::warning::This copy is $behind commits behind $name, without its latest fixes. On its main page press \"Sync fork\", then \"Update branch\", and build again."
          fi

      - uses: actions/checkout@v5

      - name: Git's bash and clang-cl
        if: runner.os == 'Windows'
        run: |
          echo "MISE_BASH_PATH=$(cygpath -w /)bin\\bash.exe" >>"$GITHUB_ENV"
          # 强制安装 LLVM，并写死环境变量，解决 find clang-cl failed 问题
          choco install llvm -y
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          "C:\Program Files\LLVM\bin\clang-cl" --version

      - name: Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -E '/Xcode_26(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
              echo "::error::No Xcode 26 on this machine: GitHub's macOS image has changed."
              exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >>"$GITHUB_ENV"
          DEVELOPER_DIR=$xcode/Contents/Developer xcodebuild -version

      - name: Room on the disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      - name: Build
        run: |
          case $PLATFORM in
          ios)
              mise run ios:ipa
              mv target/ios/Glue5.ipa Glue5-ios.ipa
              ;;
          windows)
              mise run build
              mv target/release/glue5.exe Glue5-windows.exe
              ;;
          macos)
              mise run macos:package
              mv target/package/*.dmg Glue5-macos.dmg
              ;;
          android)
              mise run android:build
              mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
              cp ~/.android/debug.keystore Glue5-android.keystore
              ;;
          linux-*)
              mise run linux:container "${PLATFORM#linux-}"
              mv target/package/*.AppImage "Glue5-$PLATFORM.AppImage"
              ;;
          esac

      - name: Into the draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-*